<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up</title>
  </head>
  <body> 
    {% include 'navbar.html' %}

    <h1>Register</h1>
    <form action="{% url 'finishsignup' %}" method="post">
        {% csrf_token %}
        <input type="text" placeholder="Username" name="username"/>
        <input type="password" placeholder="Password" name="password"/>
        <input type="submit"/>
    </form>
  </body>
</html>
