<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Card View</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'daily_cards.css' %}">
</head>
<body>
  <script>
    function galleryItemClicked(item, title, pk) {
      const fdm_title = document.getElementById("fdmTitle");
      const fdm_text = document.getElementById("fdmText");
      const fdm_gotoentry = document.getElementById("fdmGoToEntryLink");
      const fdm = document.getElementById("fullDisplayModal");
      fdm_title.setHTML(title);
      fdm_text.setHTML(item.getHTML());
      fdm_gotoentry.setAttribute("href", "entry/" + pk);
      fdm.showPopover();
    }
  </script>

  {% include 'navbar.html' %}
  <div class="galleryDisplay">
    {% for entry in daily_entries %}
      <div class="galleryItem" onclick="galleryItemClicked(this, '{{ entry.entry_title }}', '{{ entry.pk }}')">
        <p>{{ entry.entry_text }}</p>
      </div>
    {% endfor %}
  </div>

  <div popover id="fullDisplayModal" class="modalAboutToShow">
    <h1 id="fdmTitle"></h1>
    <p id="fdmText"></p>
    <a id="fdmGoToEntryLink" href="">Go to entry</a>
  </div>
</body>
